<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فريق العمل - إدارة المهام</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ================= شاشة تسجيل الدخول السريع (PIN) ================= -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl">
      <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">
        ⚡
      </div>
      <h2 class="text-2xl font-bold mb-2">من يدخل الآن؟</h2>
      <p class="text-slate-500 text-sm mb-6">اكتب رقم الـ PIN الخاص بك</p>
      
      <input type="password" id="pinInput" maxlength="1" placeholder="•" 
        class="w-24 h-20 text-center text-4xl font-bold bg-slate-100 border-2 border-slate-300 rounded-2xl focus:border-blue-500 focus:bg-white outline-none mb-6 transition"
        onkeyup="if(event.key === 'Enter') handleLogin()">
      
      <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30">
        دخول
      </button>

      <div class="mt-6 text-xs text-slate-400 bg-slate-50 py-3 rounded-lg border border-slate-100 grid grid-cols-2 gap-2 text-right px-4">
        <div>1: Doc 👨‍⚕️</div>
        <div>2: Hesham 💼</div>
        <div>3: Shady 💻</div>
        <div>4: Hossam 📊</div>
        <div class="col-span-2 text-center border-t pt-1">5: Hassan 🎨</div>
      </div>
    </div>
  </div>

  <!-- ================= التطبيق الرئيسي ================= -->
  <div id="app" class="hidden max-w-md mx-auto pb-28">
    
    <!-- شريط علوي -->
    <header class="bg-white p-4 sticky top-0 z-20 border-b border-slate-200 flex justify-between items-center shadow-sm">
      <div class="flex items-center gap-3">
        <div id="userAvatar" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white text-lg shadow"></div>
        <div>
          <span class="text-[11px] text-slate-400 block font-semibold">مرحباً بك</span>
          <span id="userName" class="font-bold text-slate-800 text-base"></span>
        </div>
      </div>
      <button onclick="logout()" class="text-xs text-red-500 bg-red-50 px-3 py-1.5 rounded-lg border border-red-100 font-semibold hover:bg-red-100">
        خروج
      </button>
    </header>

    <!-- أدوات الفرز والفلترة الأنيقة -->
    <div class="p-4 space-y-2.5">
      <!-- زرارين التبديل: الفريق أو أنا -->
      <div class="flex bg-slate-200/80 p-1 rounded-2xl">
        <button id="tabAllTasks" onclick="setUserFilter('all')" class="flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-blue-600 shadow-sm">
          👥 كل الفريق (<span id="allCount">0</span>)
        </button>
        <button id="tabMyTasks" onclick="setUserFilter('my')" class="flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-600">
          🎯 مهامي أنا (<span id="myCount">0</span>)
        </button>
      </div>

      <!-- القائمة المنسدلة الأنيقة بسهم لاختيار الحالة -->
      <div class="relative">
        <select id="statusSelect" onchange="setStatusFilter(this.value)" 
          class="w-full bg-white border border-slate-200/90 text-slate-700 text-xs font-bold rounded-xl px-4 py-3 outline-none focus:border-blue-500 shadow-sm appearance-none cursor-pointer">
          <option value="all">📋 عرض كل الحالات</option>
          <option value="pending">⏳ قيد الانتظار (Pending)</option>
          <option value="in_progress">🏃‍♂️ جاري العمل عليها (In Progress)</option>
          <option value="done">✅ المنتهية (Done)</option>
        </select>
        <!-- أيقونة السهم الأنيقة -->
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center px-4 text-slate-400">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
          </svg>
        </div>
      </div>
    </div>

    <!-- قائمة المهام -->
    <div class="px-4 space-y-3" id="tasksContainer">
      <div class="text-center py-12 text-slate-400 text-xs">جاري مزامنة المهام...</div>
    </div>

    <!-- زرار إضافة مهمة عائم تحت -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-slate-100 via-slate-100 to-transparent z-20">
      <button onclick="openModal()" class="max-w-md mx-auto w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl shadow-blue-500/30 flex items-center justify-center gap-2 transition active:scale-95">
        <span class="text-2xl leading-none">+</span>
        <span>تكليف بمهمة جديدة</span>
      </button>
    </div>
  </div>

  <!-- ================= نافذة إضافة مهمة جديدة ================= -->
  <div id="taskModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg text-slate-800">إسناد مهمة جديدة ✍️</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
      </div>
      
      <div class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-500 block mb-1">المهمة المطلوبة</label>
          <input type="text" id="taskTitle" placeholder="اكتب المطلوب بإيجاز..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 text-sm font-semibold">
        </div>

        <div>
          <label class="text-xs font-bold text-slate-500 block mb-1">مطلوبة من مين؟</label>
          <select id="taskAssignee" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 text-sm font-bold text-slate-700"></select>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-500 block mb-1">درجة الأهمية</label>
          <div class="flex gap-3">
            <label class="flex-1 border border-slate-200 rounded-xl p-2.5 flex items-center justify-center gap-2 cursor-pointer has-[:checked]:border-red-500 has-[:checked]:bg-red-50">
              <input type="radio" name="priority" value="high" class="accent-red-500">
              <span class="text-xs font-bold text-red-600">🔴 عاجل</span>
            </label>
            <label class="flex-1 border border-slate-200 rounded-xl p-2.5 flex items-center justify-center gap-2 cursor-pointer has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
              <input type="radio" name="priority" value="normal" checked class="accent-blue-500">
              <span class="text-xs font-bold text-blue-600">🟡 عادي</span>
            </label>
          </div>
        </div>

        <div class="bg-emerald-50 border border-emerald-200/80 rounded-xl p-3 flex items-center gap-3">
          <input type="checkbox" id="sendWhatsApp" checked class="w-4 h-4 accent-emerald-600 cursor-pointer">
          <label for="sendWhatsApp" class="text-xs font-bold text-emerald-800 cursor-pointer select-none">
            💬 إرسال إشعار في جروب الواتساب (Tasks)
          </label>
        </div>

        <button onclick="addTask()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-500/30">
          إرسال المهمة الآن 🚀
        </button>
      </div>
    </div>
  </div>

  <!-- ================= نافذة التعليقات (Comments Modal) ================= -->
  <div id="commentsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white rounded-t-3xl sm:rounded-3xl p-6 w-full max-w-md shadow-2xl flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-start mb-3 border-b border-slate-100 pb-3">
        <div>
          <span id="commentTaskStatusBadge" class="text-[10px] px-2 py-0.5 rounded-md font-bold inline-block mb-1"></span>
          <h3 id="commentTaskTitle" class="font-bold text-base text-slate-800 leading-snug"></h3>
        </div>
        <button onclick="closeCommentsModal()" class="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
      </div>

      <div id="commentsList" class="flex-1 overflow-y-auto space-y-3 py-2 pr-1">
        <div class="text-center py-6 text-slate-400 text-xs">جاري تحميل التعليقات...</div>
      </div>

      <div class="pt-3 border-t border-slate-100 flex gap-2">
        <input type="text" id="newCommentInput" placeholder="أضف تعليقاً أو استفساراً..." 
          class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-xs outline-none focus:border-blue-500 font-semibold"
          onkeyup="if(event.key === 'Enter') addComment()">
        <button onclick="addComment()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition">
          إرسال
        </button>
      </div>
    </div>
  </div>

  <!-- ================= الكود البرمجي ومحرك المزامنة ================= -->
  <script>
    const SUPABASE_URL = "https://bdslcbvidzhofknfbtpp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkc2xjYnZpZHpob2ZrbmZidHBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyOTQ5OTEsImV4cCI6MjEwNTg3MDk5MX0.-6QqAWtN5115Sbb-bsac1AnDuhEh5x4zoV7Z8kc-rmA";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const USERS = [
      { id: 1, pin: "1", name: "Doc", color: "bg-emerald-600" },
      { id: 2, pin: "2", name: "Hesham", color: "bg-blue-600" },
      { id: 3, pin: "3", name: "Shady", color: "bg-purple-600" },
      { id: 4, pin: "4", name: "Hossam", color: "bg-amber-600" },
      { id: 5, pin: "5", name: "Hassan", color: "bg-rose-600" }
    ];

    let currentUser = null;
    let userFilter = 'all';
    let statusFilter = 'all';
    let tasks = [];
    let activeTaskForComments = null;
    let lastKnownTaskId = 0; // لتعقب أحدث مهمة بدقة متناهية

    // توليد صوت التنبيه
    let audioCtx = null;
    function playNotificationSound() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // D5
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12); // A5
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch(e) { console.log("Sound err:", e); }
    }

    function triggerSystemNotification(taskTitle, creatorName) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification("⚡ مهمة جديدة لك!", {
          body: `كلفك ${creatorName} بمهمة: ${taskTitle}`,
          icon: "https://cdn-icons-png.flaticon.com/512/906/906334.png"
        });
      }
    }

    // ================= محرك المزامنة الفوري الذكي =================
    async function syncTasks(isFirstLoad = false) {
      if (!currentUser) return;
      try {
        const { data, error } = await db.from('tasks').select('*').order('id', { ascending: false });
        if (error || !data) return;

        // في أول مرة بنسجل أعلى ID موجود
        if (isFirstLoad) {
          lastKnownTaskId = data.length > 0 ? Math.max(...data.map(t => t.id)) : 0;
          tasks = data;
          render();
          return;
        }

        // فحص المهام الجديدة اللي نزلت
        if (data.length > 0) {
          const currentMaxId = Math.max(...data.map(t => t.id));
          if (currentMaxId > lastKnownTaskId) {
            // مهمة جديدة تماماً نزلت!
            const newTasks = data.filter(t => t.id > lastKnownTaskId);
            newTasks.forEach(t => {
              if (t.assigned_to === currentUser.id && t.created_by !== currentUser.id) {
                playNotificationSound();
                const creator = USERS.find(u => u.id === t.created_by);
                triggerSystemNotification(t.title, creator ? creator.name : 'أحد الزملاء');
              }
            });
            lastKnownTaskId = currentMaxId;
          }
        }

        // لو فيه أي فرق بين الداتا المعروضة والداتا الحقيقية، اعرض فوراً
        if (JSON.stringify(tasks) !== JSON.stringify(data)) {
          tasks = data;
          render();
        }
      } catch(e) {
        console.error("Sync error:", e);
      }
    }

    // فحص كل ثانية ونص (سريع جداً وخفيف تماماً على السيرفر)
    setInterval(() => syncTasks(false), 1500);

    // فحص الجلسة المحفوظة
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('team_logged_user');
      if (savedUser) initUserSession(JSON.parse(savedUser));
    });

    function handleLogin() {
      // إيقاظ الصوت
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const pin = document.getElementById('pinInput').value.trim();
      const user = USERS.find(u => u.pin === pin);
      if (user) {
        localStorage.setItem('team_logged_user', JSON.stringify(user));
        initUserSession(user);
      } else {
        alert("رقم الـ PIN غير صحيح!");
      }
    }

    function initUserSession(user) {
      currentUser = user;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('userName').innerText = user.name;
      
      const avatar = document.getElementById('userAvatar');
      avatar.innerText = user.name.charAt(0);
      avatar.className = `w-10 h-10 rounded-full flex items-center justify-center font-bold text-white text-lg shadow ${user.color}`;
      
      populateAssignees();
      syncTasks(true); // تحميل أول مرة

      if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
      }
    }

    function logout() {
      localStorage.removeItem('team_logged_user');
      currentUser = null;
      document.getElementById('pinInput').value = '';
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
    }

    function populateAssignees() {
      const select = document.getElementById('taskAssignee');
      select.innerHTML = USERS.map(u => `<option value="${u.id}">${u.name}</option>`).join('');
    }

    async function addTask() {
      const title = document.getElementById('taskTitle').value.trim();
      const assigned_to = parseInt(document.getElementById('taskAssignee').value);
      const priority = document.querySelector('input[name="priority"]:checked').value;
      const sendWhatsApp = document.getElementById('sendWhatsApp').checked;

      if (!title) return alert("من فضلك اكتب عنوان المهمة!");

      const assignee = USERS.find(u => u.id === assigned_to);
      const priorityText = priority === 'high' ? '🔴 عاجل جداً' : '🟡 عادي';

      const newTask = {
        title,
        assigned_to,
        created_by: currentUser.id,
        priority,
        status: "pending"
      };

      closeModal();
      document.getElementById('taskTitle').value = '';

      const { data, error } = await db.from('tasks').insert([newTask]).select();
      if (error) return alert("خطأ: " + error.message);

      // تحديث فوري محلي
      if (data && data[0]) {
        lastKnownTaskId = Math.max(lastKnownTaskId, data[0].id);
      }
      syncTasks(false);

      if (sendWhatsApp) {
        const message = `📢 *مهمة جديدة للفريق!*
📌 *المهمة:* ${title}
👤 *مطلوبة من:* ${assignee.name}
✍️ *بواسطة:* ${currentUser.name}
⚡ *الأولوية:* ${priorityText}

🔗 _تم التسجيل في نظام إدارة المهام_`;
        const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`;
        window.open(whatsappUrl, '_blank');
      }
    }

    async function updateStatus(id, newStatus) {
      if (newStatus === 'done') {
        confetti({ particleCount: 80, spread: 70, origin: { y: 0.7 } });
      }
      const { error } = await db.from('tasks').update({ status: newStatus }).eq('id', id);
      if (error) alert("خطأ: " + error.message);
      syncTasks(false);
    }

    async function deleteTask(id) {
      if (!confirm("هل أنت متأكد من حذف هذه المهمة نهائياً؟")) return;
      const { error } = await db.from('tasks').delete().eq('id', id);
      if (error) alert("خطأ: " + error.message);
      syncTasks(false);
    }

    function setUserFilter(filter) {
      userFilter = filter;
      document.getElementById('tabAllTasks').className = filter === 'all' 
        ? "flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-blue-600 shadow-sm" 
        : "flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-600";

      document.getElementById('tabMyTasks').className = filter === 'my' 
        ? "flex-1 py-2 text-xs font-bold rounded-xl transition bg-white text-blue-600 shadow-sm" 
        : "flex-1 py-2 text-xs font-bold rounded-xl transition text-slate-600";

      render();
    }

    function setStatusFilter(status) {
      statusFilter = status;
      render();
    }

    function render() {
      const container = document.getElementById('tasksContainer');
      if (!container) return;

      const myPendingCount = tasks.filter(t => t.assigned_to === currentUser?.id && t.status !== 'done').length;
      document.getElementById('allCount').innerText = tasks.length;
      document.getElementById('myCount').innerText = myPendingCount;

      let filtered = tasks;
      if (userFilter === 'my') {
        filtered = filtered.filter(t => t.assigned_to === currentUser?.id);
      }
      if (statusFilter !== 'all') {
        filtered = filtered.filter(t => t.status === statusFilter);
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-400 text-xs bg-white rounded-2xl border border-dashed border-slate-200">لا توجد مهام في هذا الفلتر ✨</div>`;
        return;
      }

      container.innerHTML = filtered.map(t => renderCard(t)).join('');
    }

    function renderCard(task) {
      const assignee = USERS.find(u => u.id === task.assigned_to);
      const creator = USERS.find(u => u.id === task.created_by);
      const isMyTask = task.assigned_to === currentUser?.id;
      const amICreator = task.created_by === currentUser?.id;

      let statusBadge = '';
      if (task.status === 'pending') {
        statusBadge = `<span class="text-[10px] bg-amber-50 text-amber-600 border border-amber-200 font-bold px-2 py-0.5 rounded-md">⏳ انتظار</span>`;
      } else if (task.status === 'in_progress') {
        statusBadge = `<span class="text-[10px] bg-blue-50 text-blue-600 border border-blue-200 font-bold px-2 py-0.5 rounded-md">🏃‍♂️ جاري العمل</span>`;
      } else {
        statusBadge = `<span class="text-[10px] bg-emerald-50 text-emerald-600 border border-emerald-200 font-bold px-2 py-0.5 rounded-md">✅ تمت</span>`;
      }

      let actionButtons = '';
      if (isMyTask) {
        if (task.status === 'pending') {
          actionButtons = `<button onclick="updateStatus(${task.id}, 'in_progress')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition active:scale-95">🏃‍♂️ بدء العمل</button>`;
        } else if (task.status === 'in_progress') {
          actionButtons = `<button onclick="updateStatus(${task.id}, 'done')" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm transition active:scale-95">✅ تم الإنجاز</button>`;
        } else {
          actionButtons = `<button onclick="updateStatus(${task.id}, 'in_progress')" class="text-[11px] font-bold text-slate-500 hover:text-slate-700 bg-slate-100 px-2.5 py-1 rounded-lg">↩️ إعادة فتح</button>`;
        }
      } else {
        if (task.status === 'pending') {
          actionButtons = `<span class="text-[11px] font-semibold text-slate-400 bg-slate-100 px-2.5 py-1 rounded-lg">⏳ عند ${assignee ? assignee.name : ''}</span>`;
        } else if (task.status === 'in_progress') {
          actionButtons = `<span class="text-[11px] font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-lg">🏃‍♂️ ${assignee ? assignee.name : ''} شغال</span>`;
        } else {
          actionButtons = `<span class="text-[11px] font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-lg">✔️ أنجزها ${assignee ? assignee.name : ''}</span>`;
        }
      }

      return `
        <div class="bg-white p-4 rounded-2xl border ${isMyTask && task.status !== 'done' ? 'border-blue-300 ring-2 ring-blue-50 shadow-md' : 'border-slate-200/80 shadow-sm'} flex flex-col gap-2.5 transition">
          <div class="flex justify-between items-start">
            <div class="flex items-center gap-1.5">
              ${statusBadge}
              <span class="text-[10px] px-2 py-0.5 rounded-md font-bold ${task.priority === 'high' ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-slate-100 text-slate-500'}">
                ${task.priority === 'high' ? '🔴 عاجل' : '🟡 عادي'}
              </span>
            </div>

            <div class="flex items-center gap-2">
              <span class="text-[10px] text-slate-400">من: ${creator ? creator.name : ''}</span>
              ${amICreator ? `
                <button onclick="deleteTask(${task.id})" title="حذف" class="text-slate-300 hover:text-red-500 text-xs transition">🗑️</button>
              ` : ''}
            </div>
          </div>

          <div onclick="openCommentsModal(${task.id})" class="cursor-pointer group">
            <p class="font-bold text-slate-800 text-sm leading-relaxed ${task.status === 'done' ? 'line-through text-slate-400' : ''} group-hover:text-blue-600 transition">
              ${task.title}
            </p>
            <span class="text-[11px] text-blue-500 font-semibold inline-flex items-center gap-1 mt-1">
              💬 عرض التعليقات والملاحظات...
            </span>
          </div>

          <div class="flex justify-between items-center pt-2.5 border-t border-slate-100 text-xs">
            <div class="flex items-center gap-1.5">
              <span class="text-slate-400 text-[10px]">مطلوبة من:</span>
              <span class="inline-flex items-center gap-1 font-bold text-slate-700">
                <span class="w-2 h-2 rounded-full ${assignee ? assignee.color : 'bg-gray-400'}"></span>
                ${assignee ? assignee.name : ''} ${isMyTask ? '<span class="text-[10px] text-blue-600 font-extrabold">(أنت)</span>' : ''}
              </span>
            </div>

            <div>${actionButtons}</div>
          </div>
        </div>
      `;
    }

    // ================= التعليقات =================
    async function openCommentsModal(taskId) {
      activeTaskForComments = tasks.find(t => t.id === taskId);
      if (!activeTaskForComments) return;

      document.getElementById('commentTaskTitle').innerText = activeTaskForComments.title;
      const badge = document.getElementById('commentTaskStatusBadge');
      if (activeTaskForComments.status === 'pending') {
        badge.className = "text-[10px] bg-amber-50 text-amber-600 border border-amber-200 font-bold px-2 py-0.5 rounded-md inline-block mb-1";
        badge.innerText = "⏳ قيد الانتظار";
      } else if (activeTaskForComments.status === 'in_progress') {
        badge.className = "text-[10px] bg-blue-50 text-blue-600 border border-blue-200 font-bold px-2 py-0.5 rounded-md inline-block mb-1";
        badge.innerText = "🏃‍♂️ جاري العمل";
      } else {
        badge.className = "text-[10px] bg-emerald-50 text-emerald-600 border border-emerald-200 font-bold px-2 py-0.5 rounded-md inline-block mb-1";
        badge.innerText = "✅ تمت بنجاح";
      }

      document.getElementById('commentsModal').classList.remove('hidden');
      document.getElementById('commentsModal').classList.add('flex');
      loadComments(taskId);
    }

    async function loadComments(taskId) {
      const list = document.getElementById('commentsList');
      list.innerHTML = `<div class="text-center py-4 text-slate-400 text-xs">جاري تحميل التعليقات...</div>`;

      const { data, error } = await db.from('task_comments').select('*').eq('task_id', taskId).order('id', { ascending: true });
      if (error) {
        list.innerHTML = `<div class="text-center text-red-500 text-xs">خطأ في جلب التعليقات</div>`;
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs bg-slate-50 rounded-xl border border-dashed border-slate-200">لا توجد تعليقات حتى الآن، اكتب أول تعليق!</div>`;
        return;
      }

      list.innerHTML = data.map(c => {
        const author = USERS.find(u => u.id === c.user_id);
        const isMe = author && author.id === currentUser?.id;
        const time = new Date(c.created_at).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        return `
          <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
            <div class="flex items-center gap-1.5 mb-1">
              <span class="text-[10px] font-bold text-slate-600">${author ? author.name : ''}</span>
              <span class="text-[9px] text-slate-400">${time}</span>
            </div>
            <div class="p-2.5 rounded-2xl text-xs max-w-[85%] font-medium ${isMe ? 'bg-blue-600 text-white rounded-tl-none' : 'bg-slate-100 text-slate-800 rounded-tr-none'}">
              ${c.comment_text}
            </div>
          </div>
        `;
      }).join('');

      list.scrollTop = list.scrollHeight;
    }

    async function addComment() {
      const input = document.getElementById('newCommentInput');
      const text = input.value.trim();
      if (!text || !activeTaskForComments) return;

      input.value = '';
      const { error } = await db.from('task_comments').insert([{
        task_id: activeTaskForComments.id,
        user_id: currentUser.id,
        comment_text: text
      }]);

      if (error) alert("خطأ في إضافة التعليق: " + error.message);
      else loadComments(activeTaskForComments.id);
    }

    function closeCommentsModal() {
      document.getElementById('commentsModal').classList.add('hidden');
      document.getElementById('commentsModal').classList.remove('flex');
      activeTaskForComments = null;
    }

    function openModal() {
      document.getElementById('taskModal').classList.remove('hidden');
      document.getElementById('taskModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('taskModal').classList.add('hidden');
      document.getElementById('taskModal').classList.remove('flex');
    }
  </script>
</body>
</html>
